<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Todos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Todos</h1>
    <form id="todo-form">
      <input id="todo-input" autocomplete="off" placeholder="What needs doing?" />
      <button id="add-todo" type="submit">Add</button>
    </form>
    <div class="filters">
      <button data-filter="all">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </div>
    <ul id="todo-list"></ul>
    <script src="app.js"></script>
  </body>
</html>
