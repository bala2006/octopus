name: CI

# Every push and pull request runs the full test suite, so regressions are caught before they reach main.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  FORCE_COLOR: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  backend:
    name: Backend · lint + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gate integrity diffs the pull request against its base
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
      - name: Gate integrity (no weakened checks)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_CHANGE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'gate-change') }}
        run: python scripts/gate_integrity.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Lint (syntax errors, undefined names)
        working-directory: backend
        run: .venv/bin/ruff check app tests --select E9,F63,F7,F82 --output-format github
      - name: Architecture (import-linter layer rules)
        working-directory: backend
        run: .venv/bin/lint-imports
      - name: Tests
        working-directory: backend
        run: .venv/bin/python -m pytest -q --junitxml=pytest-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend · typecheck + unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Workspace formatting
        run: npm run format:workspace:check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  api-types:
    name: API types in sync with the backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt
          npm ci --no-audit --no-fund --prefix frontend
      - name: Regenerate src/types/api.gen.ts from the FastAPI schema
        working-directory: frontend
        run: npm run gen:api
      - name: Fail if the committed types are stale
        run: |
          if ! git diff --exit-code -- frontend/src/types/api.gen.ts; then
            echo "::error file=frontend/src/types/api.gen.ts::API types are out of date. Run 'make gen-api' and commit the result."
            exit 1
          fi

  visual:
    name: Visual · Windows baseline (26 gated screens)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Chromium for Playwright
        run: backend\.venv\Scripts\python.exe -m playwright install chromium
      - name: Capture screens
        run: backend\.venv\Scripts\python.exe scripts\visual\capture.py --out visual-run
      - name: Compare with the committed baseline
        run: backend\.venv\Scripts\python.exe scripts\visual\compare.py --captures visual-run --baseline scripts\visual\baseline
      - name: Upload captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-captures
          path: visual-run
          retention-days: 7

  ci-passed:
    name: CI passed
    if: always()
    needs: [backend, frontend, api-types, visual]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::One or more CI jobs did not succeed"
          exit 1
      - run: echo "All CI jobs passed"
