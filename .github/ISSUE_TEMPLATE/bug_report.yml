name: Bug report
description: Report a reproducible problem with Octopus.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For vulnerabilities or leaked credentials, **do not use this public form**; follow [SECURITY.md](https://github.com/bala2006/octopus/blob/main/SECURITY.md).
  - type: input
    id: summary
    attributes:
      label: Problem summary
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python/Node versions, Octopus commit, native/Docker, Demo Mode/real model
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots (optional)
      description: Redact tokens, API keys, customer information, and personal data.
